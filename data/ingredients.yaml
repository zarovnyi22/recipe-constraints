# Інгредієнти. per_100g — на 100 г інгредієнта, конвенція ЄС/України:
#   carbs   = засвоювані вуглеводи БЕЗ клітковини і БЕЗ polyols (USDA «carbohydrate» мінус fibre);
#   sugars  ⊂ carbs;  fibre і polyols — окремо;  salt = Na·2,5 (г);
#   polyols = г «інших» вуглеводів з енергією ≠ 4 ккал/г: багатоатомні спирти (еритрит, мальтит),
#             органічні кислоти (лимонна, оцтова) — їх енергія в energy_kcal, перевірка Atwater
#             допускає діапазон 0…2,4 ккал/г для них і 0…2 ккал/г для клітковини.
# sweetness — сахарозний еквівалент на 1 г інгредієнта (сахароза = 1): Σ x_i·sweetness_i = «г цукру-
#   еквівалента». Розраховано: г цукрів/100 × відносна солодкість цукру (лактоза 0,16; мальтоза 0,4;
#   глюкоза 0,7; сахароза 1; фруктоза 1,2; поліоли/інтенсивні — з довідників і spec-*.md з pet).
# min_dose_pct / max_dose_pct — частка маси продукту, якщо інгредієнт у рецептурі взагалі є.
# Ціни — ОЦІНКИ (грн/кг, дата price_date), порядок цифр — у PRICES.md.

