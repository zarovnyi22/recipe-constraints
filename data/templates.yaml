# Шаблони продуктів (жорстка технологія). Одиниці: %, г.
# roles.<роль>: min_pct/max_pct — сума ролі у % маси рецептури; mode: one_of = рівно один
#   інгредієнт ролі (розв'язувач перебирає варіанти), blend = будь-яка суміш;
#   flavor_min_pct — мінімум НАЗВАНОГО інгредієнта (смак/характерний), % рецептури; є в кожному
#   шаблоні на ролях, які дають продукту назву. Крім того названий смак ≥ 50 % своєї ролі (полуничний
#   йогурт: полуниці не менше, ніж усіх інших фруктів разом). Інгредієнт з дозою ≤ мінімуму (ванілін
#   0,1 %) — мінімум обрізано його дозою. Значення — технологічні припущення (README).
# nutrient_min_per_100g — технологічний мінімум нутрієнта в готовому продукті (жорстко).
# dose_limits_pct — суворіші за ingredients.yaml межі доз для цього продукту (еритрит ≤ 8 % у м'яких).
# sweetness_min — мінімум сахарозного еквівалента, г на 100 г ГОТОВОГО продукту (щоб «без цукру»
#   не дав несолодкий продукт). moisture_loss_pct — частка маси сирої рецептури, що випаровується
#   (лише печиво): маса рецептури = 1000 / (1 − loss/100), відсотки ролей — від маси рецептури.
# density_g_per_ml — лише для рідин (form: drinkable), обов'язкова: пороги тверджень для рідин
#   задано на 100 мл, рецептура рахує на 100 г → поріг/100 г = поріг/100 мл ÷ density. Густина
#   фіксована для шаблону (не залежить від рецептури) — береться типова для продукту з цукрами;
#   у рецептури зі зниженим цукром справжня густина менша, тож поріг на 100 г суворіший — з запасом.
# base_recipe — робоча відправна рецептура (грами на масу рецептури), НЕ оптимум: перевіряється тестами.

- id: yogurt_spoonable
  name_uk: Йогурт густий (ложковий)
  aliases: [йогурт, густий йогурт, термостатний йогурт, йогурт ложковий]
  form: spoonable
  description: Ферментована основа (молочна або рослинна) із закваскою, фруктами, підсолоджувачем.
  reference: yogurt_spoonable
  sweetness_min: 7.0
  moisture_loss_pct: 0
  dose_limits_pct: {erythritol: 8}
  pairings:  # technology: plant base → plant culture only, dairy base → dairy culture
    - role: base
      then: culture
      by_group:
        dairy_bases: [bulk_starter_milk, dvs_culture_dairy]
        plant_bases: [dvs_culture_plant]
  roles:
    base:
      mode: one_of
      min_pct: 55
      max_pct: 90
      ingredients: [milk_2_5, milk_whole_3_5, soy_drink, oat_drink, coconut_drink, almond_drink, pea_drink, rice_drink]
    culture:
      mode: one_of
      min_pct: 0.01
      max_pct: 3
      ingredients: [bulk_starter_milk, dvs_culture_dairy, dvs_culture_plant]
    fruit:
      mode: blend
      min_pct: 0
      max_pct: 25
      flavor_min_pct: 10
      ingredients: [strawberry_frozen, raspberry_frozen, blueberry_frozen, banana_puree, apple_puree, mango_puree]
    sweetener:  # цукор ≤ 10 %: типово 5–10 % у фруктових йогуртах (припущення, README)
      mode: blend
      min_pct: 0
      max_pct: 10
      ingredients: [sugar, honey, glucose_syrup, stevia]
    bulking:
      mode: blend
      min_pct: 0
      max_pct: 10
      ingredients: [erythritol, polydextrose]
    protein:
      mode: blend
      min_pct: 0
      max_pct: 8
      ingredients: [skim_milk_powder, whey_protein_conc_80, pea_protein_isolate, soy_protein_isolate]
    stabilizer:
      mode: blend
      min_pct: 0
      max_pct: 3
      ingredients: [pectin, modified_starch, xanthan_gum, gelatin, agar]
    flavour:
      mode: blend
      min_pct: 0
      max_pct: 5
      flavor_min_pct: 2
      ingredients: [cocoa_powder, vanillin, cinnamon]
    cream:
      mode: blend
      min_pct: 0
      max_pct: 15
      flavor_min_pct: 5
      ingredients: [coconut_cream]
  base_recipe: {milk_2_5: 760, dvs_culture_dairy: 0.2, strawberry_frozen: 150, sugar: 80, pectin: 5, skim_milk_powder: 4.8}

