- id: nectar
  name_uk: Нектар
  aliases: [нектар, фруктовий нектар, яблучний нектар, апельсиновий нектар]
  form: drinkable
  density_g_per_ml: 1.05  # нектар 12–13 °Brix ≈ 1,048–1,052 г/мл при 20 °C (таблиці Brix–густина сахарози, ICUMSA)
  # Мінімум соку 50 %: Директива 2001/112/ЄС, додаток IV, частина II — яблучний, апельсиновий
  # нектар ≥ 50 % фруктової частини; цукрів/меду ≤ 20 % маси (додаток I, частина II, п. 2).
  # Україна перенесла ці вимоги у «Вимоги до фруктових соків та деяких аналогічних продуктів»
  # (Держпродспоживслужба: «для нектарів — зазначений вміст фруктової частини»).
  description: Сік (не менше 50 % — норматив нектару) + вода + цукри/підсолоджувачі (≤ 20 %) + кислота.
  reference: nectar
  sweetness_min: 8.0
  moisture_loss_pct: 0
  dose_limits_pct: {erythritol: 8}
  roles:
    juice:
      mode: blend
      min_pct: 50
      max_pct: 95
      flavor_min_pct: 50
      ingredients: [apple_juice, orange_juice]
    water:
      mode: blend
      min_pct: 0
      max_pct: 50
      ingredients: [water]
    sweetener:
      mode: blend
      min_pct: 0
      max_pct: 20
      ingredients: [sugar, honey, glucose_syrup, stevia]
    bulking:
      mode: blend
      min_pct: 0
      max_pct: 5
      ingredients: [erythritol, polydextrose]
    acid:
      mode: blend
      min_pct: 0
      max_pct: 1
      ingredients: [citric_acid]
  base_recipe: {apple_juice: 500, sugar: 60, citric_acid: 1, water: 439}

