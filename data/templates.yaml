  reference: juice_drink
  sweetness_min: 8.0
  moisture_loss_pct: 0
  dose_limits_pct: {erythritol: 8}
  roles:
    juice:
      mode: blend
      min_pct: 10
      max_pct: 60
      ingredients: [apple_juice, orange_juice]
    water:
      mode: blend
      min_pct: 20
      max_pct: 85
      ingredients: [water]
    sweetener:
      mode: blend
      min_pct: 0
      max_pct: 10
      ingredients: [sugar, honey, glucose_syrup, stevia]
    bulking:
      mode: blend
      min_pct: 0
      max_pct: 5
      ingredients: [erythritol, polydextrose]
    acid:
      mode: blend
      min_pct: 0
      max_pct: 1
      ingredients: [citric_acid]
  base_recipe: {apple_juice: 250, orange_juice: 100, sugar: 50, citric_acid: 0.5, water: 599.5}

